<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- Original stylised paper-cut skyline of Indian landmarks (Gateway of India, Lotus Temple, Taj Mahal, Qutub Minar, India Gate, Charminar, modern towers). Drawn for Dyau; no third-party artwork. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.9"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <!-- back layer: soft hills / distant towers -->
    <g opacity="0.35">
      <rect x="0" y="150" width="1600" height="70"/>
      <rect x="60" y="110" width="28" height="60"/><rect x="100" y="95" width="22" height="75"/>
      <rect x="1380" y="100" width="26" height="70"/><rect x="1420" y="85" width="20" height="85"/><rect x="1450" y="112" width="34" height="58"/>
      <path d="M640 160 q40 -40 80 0 z"/><path d="M880 160 q50 -50 100 0 z"/>
    </g>
    <!-- Gateway of India (left) -->
    <g>
      <rect x="40" y="120" width="130" height="100"/>
      <path d="M70 120 v-30 a35 35 0 0 1 70 0 v30 z" />
      <rect x="40" y="96" width="14" height="24"/><rect x="156" y="96" width="14" height="24"/>
      <rect x="44" y="84" width="6" height="12"/><rect x="160" y="84" width="6" height="12"/>
      <path d="M95 120 v-18 a10 10 0 0 1 20 0 v18 z" fill="#000" opacity="0.18"/>
    </g>
    <!-- Modern towers -->
    <g>
      <rect x="200" y="60" width="34" height="160"/><rect x="214" y="40" width="6" height="20"/>
      <rect x="244" y="90" width="26" height="130"/>
      <rect x="282" y="72" width="40" height="148"/><path d="M282 72 l20 -22 l20 22 z"/>
    </g>
    <!-- Lotus Temple -->
    <g>
      <rect x="340" y="170" width="190" height="50"/>
      <path d="M435 100 c-10 20 -40 40 -70 70 h140 c-30 -30 -60 -50 -70 -70 z"/>
      <path d="M435 112 c-6 18 -26 38 -44 58 h88 c-18 -20 -38 -40 -44 -58 z" fill="#000" opacity="0.14"/>
      <path d="M380 150 c-16 6 -30 14 -40 20 h60 z"/><path d="M490 150 c16 6 30 14 40 20 h-60 z"/>
    </g>
    <!-- India Gate -->
    <g>
      <rect x="560" y="140" width="110" height="80"/>
      <rect x="575" y="80" width="80" height="60"/>
      <rect x="590" y="62" width="50" height="18"/>
      <path d="M593 140 v-26 a22 22 0 0 1 44 0 v26 z" fill="#000" opacity="0.18"/>
    </g>
    <!-- Taj Mahal (centre) -->
    <g>
      <rect x="700" y="160" width="300" height="60"/>
      <rect x="720" y="130" width="260" height="30"/>
      <path d="M850 50 c-45 20 -70 50 -70 80 h140 c0 -30 -25 -60 -70 -80 z"/>
      <rect x="846" y="34" width="8" height="16"/><circle cx="850" cy="32" r="4"/>
      <path d="M760 110 c-14 8 -22 18 -22 26 h44 c0 -8 -8 -18 -22 -26 z"/><path d="M940 110 c-14 8 -22 18 -22 26 h44 c0 -8 -8 -18 -22 -26 z"/>
      <rect x="704" y="70" width="12" height="90"/><path d="M704 70 q6 -12 12 0 z"/>
      <rect x="984" y="70" width="12" height="90"/><path d="M984 70 q6 -12 12 0 z"/>
      <rect x="724" y="88" width="10" height="72"/><rect x="966" y="88" width="10" height="72"/>
      <path d="M836 160 v-18 a14 14 0 0 1 28 0 v18 z" fill="#000" opacity="0.18"/>
    </g>
    <!-- Charminar -->
    <g>
      <rect x="1040" y="130" width="120" height="90"/>
      <rect x="1040" y="70" width="14" height="60"/><rect x="1146" y="70" width="14" height="60"/>
      <path d="M1040 70 q7 -14 14 0 z"/><path d="M1146 70 q7 -14 14 0 z"/>
      <rect x="1064" y="100" width="72" height="30"/>
      <path d="M1086 130 v-14 a14 14 0 0 1 28 0 v14 z" fill="#000" opacity="0.18"/>
    </g>
    <!-- Qutub Minar -->
    <g>
      <path d="M1210 220 l6 -170 h26 l6 170 z"/>
      <rect x="1206" y="100" width="46" height="6"/><rect x="1208" y="140" width="42" height="6"/><rect x="1210" y="180" width="38" height="6"/>
      <path d="M1216 50 q13 -14 26 0 z"/>
    </g>
    <!-- Modern towers (right) -->
    <g>
      <rect x="1290" y="50" width="30" height="170"/><rect x="1302" y="30" width="6" height="20"/>
      <rect x="1330" y="96" width="24" height="124"/>
      <rect x="1500" y="80" width="46" height="140"/><path d="M1500 80 l23 -24 l23 24 z"/>
      <rect x="1556" y="120" width="30" height="100"/>
    </g>
    <rect x="0" y="212" width="1600" height="8"/>
  </g>
</svg>
